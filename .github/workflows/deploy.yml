name: Deploy to Raspberry Pi

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    
    steps:
    - name: 🔄 Pull latest changes
      run: |
        cd ~/koala
        git fetch origin main
        git reset --hard origin/main
    
    - name: 📦 Install dependencies
      run: |
        cd ~/koala
        if [ ! -d ".venv" ]; then
          python3 -m venv .venv
        fi
        .venv/bin/pip install -r requirements.txt
    
    - name: 🔄 Setup and restart bot service
      run: |
        cd ~/koala
        if [ ! -f /etc/systemd/system/koala-bot.service ]; then
          echo "Creating systemd service..."
          sudo tee /etc/systemd/system/koala-bot.service > /dev/null << EOF
        [Unit]
        Description=Koala Discord Bot
        After=network.target
        
        [Service]
        Type=simple
        User=$USER
        WorkingDirectory=$HOME/koala
        Environment="PATH=$HOME/koala/.venv/bin"
        ExecStart=$HOME/koala/.venv/bin/python $HOME/koala/main.py
        Restart=always
        RestartSec=10
        
        [Install]
        WantedBy=multi-user.target
        EOF
          sudo systemctl daemon-reload
          sudo systemctl enable koala-bot
        fi
        sudo systemctl restart koala-bot
        echo "✅ Bot déployé et redémarré avec succès"
